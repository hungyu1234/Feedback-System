<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 피드백</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a1a;color:#e0e0e0;min-height:100vh;padding:24px}
.container{max-width:720px;margin:0 auto}
.top{display:flex;gap:8px;margin-bottom:12px}
.top input{flex:1;height:36px;font-size:13px;border:1px solid #444;border-radius:8px;padding:0 12px;background:#2a2a2a;color:#e0e0e0;outline:none}
.top input:focus{border-color:#666}
.top button{height:36px;font-size:13px;padding:0 16px;border:1px solid #555;border-radius:8px;background:#2a2a2a;color:#e0e0e0;cursor:pointer;white-space:nowrap}
.top button:hover{background:#333}
.proj-list{display:flex;flex-direction:column;gap:8px}
.proj{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:12px;overflow:hidden}
.proj-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.proj-head:hover{background:#333}
.arrow{font-size:11px;color:#888;transition:transform .18s;display:inline-block}
.arrow.open{transform:rotate(180deg)}
.proj-title{font-size:14px;font-weight:500;flex:1;color:#e0e0e0}
.cnt{font-size:12px;color:#666}
.del-proj{font-size:12px;color:#666;cursor:pointer}
.del-proj:hover{color:#e05555}
.proj-body{display:none}
.proj-body.show{display:block}
.fb-row{display:flex;align-items:center;border-top:1px solid #3a3a3a;padding:10px 16px;cursor:pointer}
.fb-row:hover{background:#333}
.fb-date{font-size:12px;color:#888;min-width:90px}
.fb-title{font-size:13px;color:#e0e0e0;flex:1}
.fb-del{font-size:13px;color:#666;cursor:pointer;padding:0 2px}
.fb-del:hover{color:#e05555}
.fb-detail{background:#1e1e1e;padding:10px 16px 12px 106px;border-top:1px solid #2a2a2a;display:none}
.fb-detail.show{display:block}
.fb-detail textarea{width:100%;font-size:12px;color:#aaa;background:transparent;border:none;outline:none;resize:none;line-height:1.6;font-family:inherit;overflow:hidden;display:block}
