<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.G. Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edeae3;--bg2:#e5e1d8;--ink:#1a1713;--ink2:#5a5550;--ink3:#9a948e;
  --border:#ccc8be;--white:#faf8f4;--nav:#1e1b17;
}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding-top:56px}

nav{background:var(--nav);height:56px;position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;padding:0 48px;gap:40px;border-bottom:1px solid #2e2b26}
nav a{font-family:'Inter',sans-serif;font-size:13px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;color:#7a756e;text-decoration:none;cursor:pointer;padding-bottom:2px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a.active{color:#f0ebe0;border-bottom-color:#f0ebe0}
nav a:hover{color:#f0ebe0}
.nav-spacer{flex:1}

.page{display:none}
.page.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.home-wrap{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 48px 60px;text-align:center}
.home-eyebrow{font-family:'Inter',sans-serif;font-size:13px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--ink3);margin-bottom:20px}
.home-name{font-family:'Playfair Display',serif;font-size:clamp(48px,8vw,96px);font-weight:600;line-height:1;color:var(--ink);letter-spacing:-1px;margin-bottom:48px}
.home-divider{width:40px;height:1px;background:var(--ink3);margin:0 auto 48px}
.home-editor{font-family:'Inter',sans-serif;font-size:13px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);cursor:pointer;border:none;background:none;padding:0;margin-bottom:64px;display:inline-block}
.home-editor:hover{color:var(--ink)}
.home-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.home-card{background:var(--white);border:1px solid var(--border);padding:32px 28px;cursor:pointer;transition:background .2s,border-color .2s;display:flex;flex-direction:column;gap:12px;width:200px;min-height:120px;justify-content:space-between}
.home-card:hover{background:var(--nav);border-color:var(--nav)}
.home-card:hover .home-card-num,.home-card:hover .home-card-name,.home-card:hover .home-card-arr{color:#f0ebe0}
.home-card-num{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:300;color:var(--ink3);transition:color .2s}
.home-card-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:500;color:var(--ink);letter-spacing:.2px;transition:color .2s}
.home-card-arr{font-size:14px;color:var(--ink3);align-self:flex-end;transition:color .2s}

.content-wrap{padding:60px 48px;max-width:820px;margin:0 auto}
.page-eyebrow{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--ink3);margin-bottom:16px}
.page-heading{font-family:'Playfair Display',serif;font-size:clamp(44px,6vw,72px);font-weight:600;line-height:1;color:var(--ink);letter-spacing:-1px;margin-bottom:40px;border-bottom:1px solid var(--border);padding-bottom:32px}

.add-proj{display:flex;gap:8px;margin-bottom:32px}
.add-proj input{flex:1;height:36px;background:var(--white);border:1px solid var(--border);color:var(--ink);font-size:13px;padding:0 12px;outline:none;font-family:'Noto Sans KR',sans-serif}
.add-proj input::placeholder{color:var(--ink3)}
.add-proj input:focus{border-color:var(--ink2)}
.add-proj button{height:36px;padding:0 20px;background:var(--ink);border:none;color:#e8e0d0;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.add-proj button:hover{background:#2e2b26}

.projects{display:flex;flex-direction:column;gap:6px}
.proj-card{background:var(--white);border:1px solid var(--border)}
.proj-header{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;user-select:none;transition:background .15s}
.proj-header:hover{background:#c2d0c6}
.proj-idx{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:300;color:var(--ink3);min-width:24px}
.proj-arrow{font-size:8px;color:var(--ink3);transition:transform .15s}
.proj-arrow.open{transform:rotate(90deg)}
.proj-name{flex:1;font-family:'Playfair Display',serif;font-size:18px;font-weight:500;color:var(--ink);letter-spacing:.2px}
.proj-count{font-size:13px;color:var(--ink3);margin-right:4px}
.proj-act{font-size:12px;color:var(--ink3);cursor:pointer;padding:2px 6px;border:none;background:none;font-family:'Noto Sans KR',sans-serif}
.proj-act:hover{color:#c05050}

.proj-body{display:none;border-top:1px solid var(--border)}
.proj-body.open{display:block}
.entry{border-bottom:1px solid #e8e4db}
.entry:last-child{border-bottom:none}
.entry-row{display:flex;align-items:center;padding:13px 20px;cursor:pointer;background:#f0ece4;transition:background .1s}
.entry-row:hover{background:var(--bg2)}
.entry-date{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:400;color:var(--ink3);min-width:96px;letter-spacing:.3px}
.entry-title{flex:1;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:400;color:var(--ink);letter-spacing:.2px}
.entry-del{font-size:12px;color:var(--ink3);cursor:pointer;padding:0 4px;border:none;background:none}
.entry-del:hover{color:#c05050}
.entry-detail{display:none;padding:16px 20px 20px;background:var(--bg2);border-top:1px solid var(--border)}
.entry-detail.open{display:block}
.entry-edit-row{display:flex;gap:6px;margin-bottom:10px;padding-left:96px}
.entry-edit-row input{flex:1;height:28px;background:var(--white);border:1px solid var(--border);color:var(--ink);font-size:13px;padding:0 8px;outline:none;font-family:'Noto Sans KR',sans-serif}
.entry-edit-row input:focus{border-color:var(--ink2)}
.entry-toolbar{display:flex;gap:3px;margin-bottom:10px;padding-left:96px;flex-wrap:wrap;align-items:center;position:relative}
.entry-toolbar button{height:22px;padding:0 7px;background:var(--white);border:1px solid var(--border);color:var(--ink2);font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.entry-toolbar button:hover{background:var(--bg)}
.entry-toolbar .sep{width:1px;height:12px;background:var(--border);margin:0 2px}
.color-trigger{width:22px;height:22px;border:1px solid var(--border);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}
.color-palette{display:none;position:absolute;top:26px;left:0;background:var(--white);border:1px solid var(--border);padding:8px;z-index:100;width:180px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.color-palette.show{display:block}
.palette-row{display:flex;gap:3px;margin-bottom:3px}
.palette-row:last-child{margin-bottom:0}
.pc{width:18px;height:18px;cursor:pointer;border:1px solid rgba(0,0,0,0.08)}
.pc:hover{transform:scale(1.15)}
.entry-content{margin-left:96px;min-height:20px;outline:none;color:var(--ink2);font-size:14px;line-height:1.8;word-break:break-word;font-family:'Noto Sans KR',sans-serif;letter-spacing:.2px}
.entry-content table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
.entry-content td,.entry-content th{border:1px solid var(--border);padding:5px 10px;text-align:left;min-width:60px}
.entry-content th{background:var(--bg);font-weight:500}
.save-btn{display:block;margin-left:96px;margin-top:10px;height:26px;padding:0 16px;background:var(--ink);border:none;color:#e8e0d0;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Noto Sans KR',sans-serif;opacity:.3}
.save-btn:disabled{opacity:.3;cursor:not-allowed}

.entry-add{padding:14px 20px 16px;background:var(--bg);border-top:1px solid var(--border)}
.entry-add-date{width:100%;height:30px;background:var(--white);border:1px solid var(--border);color:var(--ink2);font-size:13px;padding:0 10px;outline:none;margin-bottom:7px;font-family:'Noto Sans KR',sans-serif}
.entry-add-row{display:flex;gap:6px}
.entry-add-row input{flex:1;height:30px;background:var(--white);border:1px solid var(--border);color:var(--ink);font-size:13px;padding:0 10px;outline:none;font-family:'Noto Sans KR',sans-serif}
.entry-add-row input::placeholder{color:var(--ink3)}
.entry-add-row input:focus{border-color:var(--ink2)}
.entry-add-row button{height:30px;padding:0 16px;background:var(--ink);border:none;color:#e8e0d0;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.entry-add-row button:hover{background:#2e2b26}
.empty{font-size:13px;color:var(--ink3);padding:14px 20px;background:#faf8f4;font-family:'Noto Sans KR',sans-serif}

.tbl-ctx{position:fixed;background:var(--white);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.1);z-index:9999;padding:4px 0;min-width:140px;display:none}
.tbl-ctx.show{display:block}
.tbl-ctx-item{padding:7px 14px;font-size:13px;color:var(--ink);cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.tbl-ctx-item:hover{background:var(--bg2)}
.tbl-ctx-sep{height:1px;background:var(--border);margin:3px 0}

.status{text-align:center;padding:60px;color:var(--ink3);font-size:13px;font-family:'Noto Sans KR',sans-serif}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#e8e0d0;padding:10px 16px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;font-family:'Noto Sans KR',sans-serif}
.toast.show{opacity:1}

@media(max-width:600px){
  nav{padding:0 20px;gap:20px}
  nav a{font-size:11px;letter-spacing:1px}
  .home-wrap{padding:48px 20px 40px}
  .home-name{font-size:clamp(40px,14vw,64px);margin-bottom:32px}
  .home-cards{flex-direction:column;align-items:stretch}
  .home-card{width:100%}
  .content-wrap{padding:36px 20px}
  .page-heading{font-size:clamp(32px,10vw,48px);margin-bottom:24px;padding-bottom:20px}
  .add-proj{flex-direction:column}
  .entry-edit-row,.entry-toolbar,.entry-content,.save-btn{padding-left:0;margin-left:0}
}
</style>
</head>
<body>
<nav>
  <a onclick="showPage('home')" id="nav-home" class="active">Home</a>
  <a onclick="showPage('memo')" id="nav-memo">Project Memo</a>
  <a onclick="showPage('book')" id="nav-book">Book</a>
  <a onclick="showPage('workout')" id="nav-workout">Workout</a>
  <div class="nav-spacer"></div>
</nav>

<div class="page active" id="page-home">
  <div class="home-wrap">
    <div class="home-eyebrow">Personal Archive</div>
    <div class="home-name">H.G. Lee</div>
    <div class="home-divider"></div>
    <span class="home-editor" onclick="checkAdmin()">Editor</span>
    <div class="home-cards">
      <div class="home-card" onclick="showPage('memo')">
        <div class="home-card-num">01</div>
        <div class="home-card-name">Project Memo</div>
        <div class="home-card-arr">→</div>
      </div>
      <div class="home-card" onclick="showPage('book')">
        <div class="home-card-num">02</div>
        <div class="home-card-name">Book</div>
        <div class="home-card-arr">→</div>
      </div>
      <div class="home-card" onclick="showPage('workout')">
        <div class="home-card-num">03</div>
        <div class="home-card-name">Workout</div>
        <div class="home-card-arr">→</div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-memo">
  <div class="content-wrap">
    <div class="page-eyebrow">Archive</div>
    <div class="page-heading">Project Memo</div>
    <div class="add-proj" id="addProjWrap" style="display:none">
      <input type="text" id="projInput" placeholder="새 프로젝트명..." onkeydown="if(event.key==='Enter')addProj()">
      <button onclick="addProj()">Add</button>
    </div>
    <div class="projects" id="projects"><div class="status">불러오는 중...</div></div>
  </div>
</div>

<div class="page" id="page-book">
  <div class="content-wrap">
    <div class="page-eyebrow">Reading</div>
    <div class="page-heading">Book</div>
    <div class="add-proj" id="addProjWrapBook" style="display:none">
      <input type="text" id="projInputBook" placeholder="새 항목..." onkeydown="if(event.key==='Enter')addProjGeneric('book')">
      <button onclick="addProjGeneric('book')">Add</button>
    </div>
    <div class="projects" id="projects-book"><div class="status">불러오는 중...</div></div>
  </div>
</div>

<div class="page" id="page-workout">
  <div class="content-wrap">
    <div class="page-eyebrow">Training</div>
    <div class="page-heading">Workout</div>
    <div class="add-proj" id="addProjWrapWorkout" style="display:none">
      <input type="text" id="projInputWorkout" placeholder="새 항목..." onkeydown="if(event.key==='Enter')addProjGeneric('workout')">
      <button onclick="addProjGeneric('workout')">Add</button>
    </div>
    <div class="projects" id="projects-workout"><div class="status">불러오는 중...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="tbl-ctx" id="tblCtx">
  <div class="tbl-ctx-item" onclick="tblAddRowBelow()">아래에 행 추가</div>
  <div class="tbl-ctx-item" onclick="tblAddRowAbove()">위에 행 추가</div>
  <div class="tbl-ctx-sep"></div>
  <div class="tbl-ctx-item" onclick="tblAddColRight()">오른쪽에 열 추가</div>
  <div class="tbl-ctx-item" onclick="tblAddColLeft()">왼쪽에 열 추가</div>
  <div class="tbl-ctx-sep"></div>
  <div class="tbl-ctx-item" onclick="tblDelRow()" style="color:#c05050">행 삭제</div>
  <div class="tbl-ctx-item" onclick="tblDelCol()" style="color:#c05050">열 삭제</div>
</div>

<script>
const ADMIN_PW='hglee1234';
let isAdmin=false;
if(sessionStorage.getItem('isAdmin')==='true') isAdmin=true;
let projectsData={memo:[],book:[],workout:[]};
let projects=[];
let currentTab='memo';
let openProjs=new Set();
let openEntries=new Set();
let detailCache={};
const palette=[
  ['#ffffff','#f2f2f2','#d9d9d9','#bfbfbf','#a6a6a6','#808080','#595959','#404040','#262626','#0d0d0d'],
  ['#ff0000','#ff4d4d','#ff9999','#ffcccc','#ffe6e6','#800000','#cc0000','#e60000','#ff3333','#ff8080'],
  ['#ff8c00','#ffa64d','#ffbf80','#ffd9b3','#fff0e6','#7a4200','#b35c00','#cc6e00','#ff9933','#ffb366'],
  ['#ffd700','#ffe066','#ffeb99','#fff5cc','#fffae6','#806a00','#b39500','#ccac00','#ffcc00','#ffd966'],
  ['#008000','#4daf4d','#80c280','#b3d9b3','#e6f2e6','#004d00','#006600','#007a00','#00b300','#4dc44d'],
  ['#0070c0','#3395d4','#66b0e0','#99ccec','#cce6f8','#003d6b','#005299','#0061b8','#0082db','#33a3e4'],
  ['#7030a0','#9657b8','#b385cc','#d0b3e0','#ece6f5','#3d1a57','#572680','#6a2f9c','#8540b8','#a370cc'],
];
async function req(method,path,body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  const page=document.getElementById('page-'+name);
  page.classList.add('active');page.style.animation='none';page.offsetHeight;page.style.animation='';
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='book'||name==='workout'){currentTab=name;projects=projectsData[name];loadTab(name);if(isAdmin)document.getElementById(name==='book'?'addProjWrapBook':'addProjWrapWorkout').style.display='flex';}
  else if(name==='memo'){currentTab='memo';projects=projectsData.memo;render('memo');}
}
function checkAdmin(){
  if(isAdmin){showToast('편집 모드 활성화됨');return;}
  const pw=prompt('Password:');
  if(pw===ADMIN_PW){isAdmin=true;sessionStorage.setItem('isAdmin','true');applyAdminMode();showToast('편집 모드 활성화');}
  else showToast('비밀번호 오류');
}
function applyAdminMode(){
  document.getElementById('addProjWrap').style.display='flex';
  if(currentTab==='book')document.getElementById('addProjWrapBook').style.display='flex';
  if(currentTab==='workout')document.getElementById('addProjWrapWorkout').style.display='flex';
}
function fmt(cmd){document.execCommand(cmd,false,null);}
function fmtSize(size){document.execCommand('fontSize',false,size);}
function fmtColor(color){document.execCommand('foreColor',false,color);}
function togglePalette(id){document.getElementById('pal_'+id).classList.toggle('show');}
function enableSave(eid){const b=document.getElementById('savebtn_'+eid);if(b){b.disabled=false;b.style.opacity='1';}}
function resetSize(){document.execCommand('removeFormat',false,null);}
function insertHr(){document.execCommand('insertHTML',false,'<hr style="border:none;border-top:1px solid #ccc8be;margin:8px 0;">');}
function insertTable(){const h='<table style="border-collapse:collapse;width:100%;margin:6px 0"><thead><tr><th style="border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500" contenteditable="true">Col 1</th><th style="border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500" contenteditable="true">Col 2</th><th style="border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500" contenteditable="true">Col 3</th></tr></thead><tbody><tr><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td></tr><tr><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td><td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true"></td></tr></tbody></table><br>';document.execCommand('insertHTML',false,h);}
let ctxCell=null;
document.addEventListener('contextmenu',function(e){const menu=document.getElementById('tblCtx');const cell=e.target.closest('td,th');if(!cell||!cell.closest('.entry-content')){if(menu)menu.classList.remove('show');return;}e.preventDefault();ctxCell=cell;menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.classList.add('show');});
document.addEventListener('click',function(e){const menu=document.getElementById('tblCtx');if(menu&&!e.target.closest('#tblCtx'))menu.classList.remove('show');if(!e.target.closest('.color-trigger')&&!e.target.closest('.color-palette'))document.querySelectorAll('.color-palette.show').forEach(el=>el.classList.remove('show'));});
function tblAddRowBelow(){if(!ctxCell)return;const tr=ctxCell.closest('tr');const cols=tr.cells.length;const nr=document.createElement('tr');for(let i=0;i<cols;i++){const td=document.createElement('td');td.style.cssText='border:1px solid #ccc8be;padding:5px 10px';td.contentEditable='true';nr.appendChild(td);}tr.parentNode.insertBefore(nr,tr.nextSibling);document.getElementById('tblCtx').classList.remove('show');}
function tblAddRowAbove(){if(!ctxCell)return;const tr=ctxCell.closest('tr');const cols=tr.cells.length;const nr=document.createElement('tr');for(let i=0;i<cols;i++){const td=document.createElement('td');td.style.cssText='border:1px solid #ccc8be;padding:5px 10px';td.contentEditable='true';nr.appendChild(td);}tr.parentNode.insertBefore(nr,tr);document.getElementById('tblCtx').classList.remove('show');}
function tblAddColRight(){if(!ctxCell)return;const table=ctxCell.closest('table');const ci=ctxCell.cellIndex;table.querySelectorAll('tr').forEach((tr,ri)=>{const cell=ri===0?document.createElement('th'):document.createElement('td');cell.style.cssText=ri===0?'border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500':'border:1px solid #ccc8be;padding:5px 10px';cell.contentEditable='true';tr.insertBefore(cell,tr.cells[ci+1]||null);});document.getElementById('tblCtx').classList.remove('show');}
function tblAddColLeft(){if(!ctxCell)return;const table=ctxCell.closest('table');const ci=ctxCell.cellIndex;table.querySelectorAll('tr').forEach((tr,ri)=>{const cell=ri===0?document.createElement('th'):document.createElement('td');cell.style.cssText=ri===0?'border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500':'border:1px solid #ccc8be;padding:5px 10px';cell.contentEditable='true';tr.insertBefore(cell,tr.cells[ci]);});document.getElementById('tblCtx').classList.remove('show');}
function tblDelRow(){if(!ctxCell)return;const tr=ctxCell.closest('tr');if(tr.parentNode.rows.length>1)tr.remove();document.getElementById('tblCtx').classList.remove('show');}
function tblDelCol(){if(!ctxCell)return;const table=ctxCell.closest('table');const ci=ctxCell.cellIndex;if(ctxCell.closest('tr').cells.length<=1)return;table.querySelectorAll('tr').forEach(tr=>{if(tr.cells[ci])tr.cells[ci].remove();});document.getElementById('tblCtx').classList.remove('show');}
document.addEventListener('paste',function(e){const target=e.target.closest('.entry-content');if(!target)return;const text=e.clipboardData.getData('text/plain');if(!text.includes('|'))return;const lines=text.trim().split('\n').filter(l=>l.trim()&&!l.match(/^\|[-| ]+\|$/));if(lines.length<2)return;e.preventDefault();const rows=lines.map(l=>l.split('|').filter((_,i,a)=>i>0&&i<a.length-1).map(c=>c.trim()));const header=rows[0];const body=rows.slice(1);const h='<table style="border-collapse:collapse;width:100%;margin:6px 0"><thead><tr>'+header.map(h=>'<th style="border:1px solid #ccc8be;padding:5px 10px;background:#edeae3;font-weight:500" contenteditable="true">'+h+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td style="border:1px solid #ccc8be;padding:5px 10px" contenteditable="true">'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table><br>';document.execCommand('insertHTML',false,h);});
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s).replace(/'/g,'&#39;');}
function paletteHTML(eid){return '<div class="color-palette" id="pal_'+eid+'">'+palette.map(row=>'<div class="palette-row">'+row.map(c=>'<div class="pc" style="background:'+c+'" onmousedown="event.preventDefault();fmtColor(\''+c+'\');togglePalette(\''+eid+'\')"></div>').join('')+'</div>').join('')+'</div>';}
const today=()=>new Date().toISOString().slice(0,10);
async function load(){try{const r=await req('GET','projects');projectsData.memo=r.projects||[];projects=projectsData.memo;render('memo');}catch(e){}}
async function loadTab(tab){currentTab=tab;projects=projectsData[tab];const elId='projects'+(tab==='memo'?'':'-'+tab);document.getElementById(elId).innerHTML='<div class="status">불러오는 중...</div>';try{const r=await req('GET','projects?tab='+tab);projectsData[tab]=r.projects||[];projects=projectsData[tab];render(tab);}catch(e){document.getElementById(elId).innerHTML='<div class="status">불러오기 실패</div>';}}
function render(tab){
  tab=tab||'memo';
  const elId='projects'+(tab==='memo'?'':'-'+tab);
  const el=document.getElementById(elId);
  const data=projectsData[tab]||[];
  if(!data.length){el.innerHTML='<div class="status">항목을 추가해보세요</div>';return;}
  detailCache={};
  var html='';
  for(var pi=0;pi<data.length;pi++){
    var p=data[pi];
    html+='<div class="proj-card"><div class="proj-header" onclick="toggleProj(\''+escAttr(p.id)+'\')">';
    html+='<span class="proj-idx">'+String(pi+1).padStart(2,'0')+'</span>';
    html+='<span class="proj-arrow '+(openProjs.has(p.id)?'open':'')+'">&#9654;</span>';
    html+='<span class="proj-name">'+escHTML(p.name)+'</span>';
    html+='<span class="proj-count">'+p.entries.length+'</span>';
    if(isAdmin){html+='<button class="proj-act" onclick="event.stopPropagation();renameProj(\''+escAttr(p.id)+'\',\''+escAttr(p.name)+'\')">수정</button>';html+='<button class="proj-act" onclick="event.stopPropagation();delProj(\''+escAttr(p.id)+'\')">삭제</button>';}
    html+='</div><div class="proj-body '+(openProjs.has(p.id)?'open':'')+'">';
    if(p.entries.length===0){html+='<div class="empty">항목 없음</div>';}
    else{
      for(var ei=0;ei<p.entries.length;ei++){
        var e=p.entries[ei];var eid=escAttr(e.id);
        detailCache[e.id]=e.detail||'';
        html+='<div class="entry"><div class="entry-row" onclick="toggleEntry(\''+eid+'\')">';
        html+='<span class="entry-date">'+escHTML(e.date)+'</span>';
        html+='<span class="entry-title">'+escHTML(e.title)+'</span>';
        if(isAdmin)html+='<button class="entry-del" onclick="event.stopPropagation();delEntry(\''+escAttr(p.id)+'\',\''+eid+'\')">✕</button>';
        html+='</div><div class="entry-detail '+(openEntries.has(e.id)?'open':'')+'" id="ed_'+eid+'">';
        if(isAdmin){
          html+='<div class="entry-edit-row"><input type="date" id="edate_'+eid+'" value="'+escHTML(e.date)+'" oninput="enableSave(\''+eid+'\')"><input type="text" id="etitle_'+eid+'" value="'+escHTML(e.title)+'" oninput="enableSave(\''+eid+'\')"></div>';
          html+='<div class="entry-toolbar"><button onmousedown="event.preventDefault();fmt(\'bold\')"><b>B</b></button><button onmousedown="event.preventDefault();fmt(\'italic\')"><i>I</i></button><button onmousedown="event.preventDefault();fmt(\'underline\')"><u>U</u></button><div class="sep"></div><button onmousedown="event.preventDefault();resetSize()" style="font-size:10px">S</button><button onmousedown="event.preventDefault();fmtSize(4)" style="font-size:12px">M</button><button onmousedown="event.preventDefault();fmtSize(6)" style="font-size:15px">L</button><div class="sep"></div><button onmousedown="event.preventDefault();insertHr()">—</button><div class="sep"></div><button onmousedown="event.preventDefault();insertTable()">표</button><div class="sep"></div><div class="color-trigger" onclick="togglePalette(\''+eid+'\')">A</div>'+paletteHTML(eid)+'</div>';
        }else{
          html+='<div style="padding-left:96px;font-size:12px;color:var(--ink3);margin-bottom:8px">'+escHTML(e.date)+' · '+escHTML(e.title)+'</div>';
        }
        html+='<div class="entry-content" contenteditable="'+isAdmin+'" id="econtent_'+eid+'" oninput="enableSave(\''+eid+'\')"></div>';
        if(isAdmin)html+='<button class="save-btn" id="savebtn_'+eid+'" onclick="saveEntry(\''+eid+'\')" disabled>저장</button>';
        html+='</div></div>';
      }
    }
    if(isAdmin){html+='<div class="entry-add"><input type="date" class="entry-add-date" id="date_'+escAttr(p.id)+'" value="'+today()+'"><div class="entry-add-row"><input type="text" id="ttl_'+escAttr(p.id)+'" placeholder="제목" onkeydown="if(event.key===\'Enter\')addEntry(\''+escAttr(p.id)+'\')"><input type="text" id="dtl_'+escAttr(p.id)+'" placeholder="내용 (선택)" onkeydown="if(event.key===\'Enter\')addEntry(\''+escAttr(p.id)+'\')"><button onclick="addEntry(\''+escAttr(p.id)+'\')">추가</button></div></div>';}
    html+='</div></div>';
  }
  el.innerHTML=html;
  for(var id in detailCache){var cel=document.getElementById('econtent_'+id);if(cel)cel.innerHTML=detailCache[id];}
}
function toggleProj(id){if(openProjs.has(id))openProjs.delete(id);else openProjs.add(id);render(currentTab);}
function toggleEntry(id){if(openEntries.has(id))openEntries.delete(id);else openEntries.add(id);render(currentTab);}
async function renameProj(id,oldName){const n=prompt('새 이름:',oldName);if(!n||n===oldName)return;showToast('수정 중...');const r=await req('POST','projects',{name:n,oldName:id,tab:currentTab});if(r.id){const p=projectsData[currentTab].find(p=>p.id===id);p.name=n;p.id=n;openProjs.add(n);openProjs.delete(id);render(currentTab);showToast('수정됨');}}
async function saveEntry(eid){const title=document.getElementById('etitle_'+eid).value.trim();const date=document.getElementById('edate_'+eid).value;const detail=document.getElementById('econtent_'+eid).innerHTML;if(!title)return;showToast('저장 중...');await req('PATCH','entries/'+eid,{title,date,detail});for(const p of projectsData[currentTab]){const e=p.entries.find(x=>x.id===eid);if(e){e.title=title;e.date=date;e.detail=detail;break;}}render(currentTab);showToast('저장됨');}
async function addProj(){const el=document.getElementById('projInput');const name=el.value.trim();if(!name)return;showToast('추가 중...');const r=await req('POST','projects',{name,tab:'memo'});if(r.id){projectsData.memo.push({id:r.id,name,entries:[]});openProjs.add(r.id);el.value='';render('memo');showToast('추가됨');}else showToast('오류: '+(r.error||''));}
async function addProjGeneric(tab){const inputId=tab==='book'?'projInputBook':'projInputWorkout';const el=document.getElementById(inputId);const name=el.value.trim();if(!name)return;showToast('추가 중...');const r=await req('POST','projects',{name,tab});if(r.id){projectsData[tab].push({id:r.id,name,entries:[]});openProjs.add(r.id);el.value='';render(tab);showToast('추가됨');}else showToast('오류: '+(r.error||''));}
async function delProj(id){if(!confirm('삭제할까요?'))return;await req('DELETE','projects',{name:id});projectsData[currentTab]=projectsData[currentTab].filter(p=>p.id!==id);openProjs.delete(id);render(currentTab);showToast('삭제됨');}
async function addEntry(pid){const ttl=document.getElementById('ttl_'+pid).value.trim();const dtl=document.getElementById('dtl_'+pid).value.trim();const dt=document.getElementById('date_'+pid).value;if(!ttl)return;const r=await req('POST','entries',{projectId:pid,title:ttl,detail:dtl,date:dt,tab:currentTab});if(r.id){projectsData[currentTab].find(p=>p.id===pid).entries.push({id:r.id,date:dt,title:ttl,detail:dtl});document.getElementById('ttl_'+pid).value='';document.getElementById('dtl_'+pid).value='';render(currentTab);showToast('추가됨');}}
async function delEntry(pid,eid){await req('DELETE','entries/'+eid);const p=projectsData[currentTab].find(p=>p.id===pid);p.entries=p.entries.filter(e=>e.id!==eid);openEntries.delete(eid);render(currentTab);showToast('삭제됨');}
load();
</script>
</body>
</html>
