<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 피드백</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a1a;color:#e0e0e0;min-height:100vh;padding:24px}
.container{max-width:720px;margin:0 auto}
.top{display:flex;gap:8px;margin-bottom:12px}
.top input{flex:1;height:36px;font-size:13px;border:1px solid #444;border-radius:8px;padding:0 12px;background:#2a2a2a;color:#e0e0e0;outline:none}
.top input:focus{border-color:#666}
.top button{height:36px;font-size:13px;padding:0 16px;border:1px solid #555;border-radius:8px;background:#2a2a2a;color:#e0e0e0;cursor:pointer;white-space:nowrap}
.top button:hover{background:#333}
.proj-list{display:flex;flex-direction:column;gap:8px}
.proj{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:12px;overflow:hidden}
.proj-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
.proj-head:hover{background:#333}
.arrow{font-size:11px;color:#888;transition:transform .18s;display:inline-block}
.arrow.open{transform:rotate(180deg)}
.proj-title{font-size:14px;font-weight:500;flex:1;color:#e0e0e0}
.cnt{font-size:12px;color:#666}
.del-proj{font-size:12px;color:#666;cursor:pointer}
.del-proj:hover{color:#e05555}
.proj-body{display:none}
.proj-body.show{display:block}
.fb-row{display:flex;align-items:center;border-top:1px solid #3a3a3a;padding:10px 16px;cursor:pointer}
.fb-row:hover{background:#333}
.fb-date{font-size:12px;color:#888;min-width:90px}
.fb-title{font-size:13px;color:#e0e0e0;flex:1}
.fb-del{font-size:13px;color:#666;cursor:pointer;padding:0 2px}
.fb-del:hover{color:#e05555}
.fb-detail{background:#242424;padding:10px 16px 12px 106px;border-top:1px solid #3a3a3a;display:none}
.fb-detail.show{display:block}
.fb-detail textarea{width:100%;font-size:12px;color:#ccc;background:transparent;border:none;outline:none;resize:none;line-height:1.6;font-family:inherit;min-height:48px}
.add-area{border-top:1px solid #3a3a3a;padding:10px 16px 12px}
.date-row{margin-bottom:8px}
.date-row input[type=date]{width:100%;height:34px;font-size:13px;border:1px solid #444;border-radius:8px;padding:0 12px;background:#2a2a2a;color:#e0e0e0;outline:none}
.input-row{display:flex;gap:6px}
.input-row input[type=text]{flex:1;height:34px;font-size:13px;border:1px solid #444;border-radius:8px;padding:0 12px;background:#2a2a2a;color:#e0e0e0;outline:none}
.input-row input[type=text]:focus{border-color:#666}
.input-row button{height:34px;font-size:13px;padding:0 16px;border:1px solid #555;border-radius:8px;background:#2a2a2a;color:#e0e0e0;cursor:pointer;white-space:nowrap}
.input-row button:hover{background:#333}
.empty{font-size:12px;color:#666;padding:10px 16px;border-top:1px solid #3a3a3a}
.loading{text-align:center;padding:40px;color:#666;font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:#333;color:#e0e0e0;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <input type="text" id="newProj" placeholder="새 프로젝트명 입력..." onkeydown="if(event.key==='Enter')addProj()">
    <button onclick="addProj()">+ 프로젝트 추가</button>
  </div>
  <div id="list" class="proj-list"><div class="loading">불러오는 중...</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const today=()=>new Date().toISOString().slice(0,10);
let data=[];
let nid=1;
let expanded=new Set();

async function api(method,path,body){
  const res=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  return res.json();
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

async function load(){
  const res=await api('GET','projects');
  data=res.projects||[];
  render();
}

function render(){
  if(!data.length){
    document.getElementById('list').innerHTML='<div class="loading">프로젝트를 추가해보세요</div>';
    return;
  }
  document.getElementById('list').innerHTML=data.map(p=>`
    <div class="proj">
      <div class="proj-head" onclick="toggleProj('${p.id}')">
        <span class="arrow ${expanded.has(p.id)?'open':''}">▼</span>
        <span class="proj-title">${p.name}</span>
        <span class="cnt">${p.entries.length}개</span>
        <span class="del-proj" onclick="event.stopPropagation();delProj('${p.id}')">삭제</span>
      </div>
      <div class="proj-body ${expanded.has(p.id)?'show':''}">
        ${p.entries.length===0?'<div class="empty">피드백 없음</div>':
          p.entries.map(e=>`
            <div>
              <div class="fb-row" onclick="toggleEntry('${p.id}','${e.id}')">
                <span class="fb-date">${e.date}</span>
                <span class="fb-title">${e.title}</span>
                <span class="fb-del" onclick="event.stopPropagation();delEntry('${p.id}','${e.id}')">✕</span>
              </div>
              <div class="fb-detail ${e.open?'show':''}" id="det_${e.id}">
                <textarea rows="2" onblur="saveDetail('${e.id}',this.value)">${e.detail||''}</textarea>
              </div>
            </div>`).join('')}
        <div class="add-area">
          <div class="date-row">
            <input type="date" id="d_${p.id}" value="${today()}">
          </div>
          <div class="input-row">
            <input type="text" id="ttl_${p.id}" placeholder="제목" onkeydown="if(event.key==='Enter')addEntry('${p.id}')">
            <input type="text" id="dtl_${p.id}" placeholder="내용 (선택)" onkeydown="if(event.key==='Enter')addEntry('${p.id}')">
            <button onclick="addEntry('${p.id}')">추가</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function toggleProj(id){
  if(expanded.has(id))expanded.delete(id);else expanded.add(id);
  render();
}

async function addProj(){
  const el=document.getElementById('newProj');
  const name=el.value.trim();
  if(!name)return;
  const res=await api('POST','projects',{name});
  if(res.id){data.push({id:res.id,name,entries:[]});expanded.add(res.id);el.value='';render();toast('프로젝트 추가됨');}
}

async function delProj(id){
  if(!confirm('프로젝트 전체 삭제할까요?'))return;
  await api('DELETE','projects',{name:id});
  data=data.filter(x=>x.id!==id);expanded.delete(id);render();toast('삭제됨');
}

function toggleEntry(pid,eid){
  const e=data.find(x=>x.id===pid).entries.find(x=>x.id===eid);
  e.open=!e.open;render();
}

async function addEntry(pid){
  const ttl=document.getElementById('ttl_'+pid).value.trim();
  const dtl=document.getElementById('dtl_'+pid).value.trim();
  const dt=document.getElementById('d_'+pid).value;
  if(!ttl)return;
  const res=await api('POST','entries',{projectId:pid,title:ttl,detail:dtl,date:dt});
  if(res.id){
    data.find(x=>x.id===pid).entries.push({id:res.id,date:dt,title:ttl,detail:dtl,open:false});
    document.getElementById('ttl_'+pid).value='';
    document.getElementById('dtl_'+pid).value='';
    render();toast('추가됨');
  }
}

async function delEntry(pid,eid){
  await api('DELETE','entries/'+eid);
  data.find(x=>x.id===pid).entries=data.find(x=>x.id===pid).entries.filter(x=>x.id!==eid);
  render();toast('삭제됨');
}

async function saveDetail(eid,val){
  await api('PATCH','entries/'+eid,{detail:val});
}

load();
</script>
</body>
</html>
